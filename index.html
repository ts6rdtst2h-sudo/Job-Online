<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JOB Kiếm Tiền Uy Tín 💵 - Nhóm Zalo</title>
  <meta name="description" content="Tham gia nhóm Zalo JOB Kiếm Tiền Uy Tín 💵 ngay hôm nay!" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(160deg, #0068ff 0%, #0047b3 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      color: #1c1e21;
    }

    .card {
      background: #ffffff;
      width: 100%;
      max-width: 390px;
      border-radius: 24px;
      padding: 64px 24px 28px;
      position: relative;
      box-shadow: 0 20px 45px rgba(0, 25, 70, 0.28);
      text-align: center;
      margin-top: 36px;
    }

    .avatar-wrap {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background: #e8f2ff;
      border: 4px solid #ffffff;
      box-shadow: 0 6px 18px rgba(0, 104, 255, 0.22);
      position: absolute;
      top: -44px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .group-title {
      font-size: 21px;
      font-weight: 700;
      color: #111827;
      margin-bottom: 4px;
      line-height: 1.3;
    }

    .group-sub {
      font-size: 14px;
      font-weight: 500;
      color: #6b7280;
      margin-bottom: 22px;
    }

    .qr-box {
      position: relative;
      width: 220px;
      height: 220px;
      margin: 0 auto 14px;
      padding: 12px;
      background: #ffffff;
      border: 1.5px solid #e5e7eb;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #qrcode img,
    #qrcode canvas {
      display: block;
      width: 192px !important;
      height: 192px !important;
    }

    .zalo-badge {
      position: absolute;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #0068ff;
      border: 3px solid #ffffff;
      color: #ffffff;
      font-weight: 800;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      letter-spacing: -0.3px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
      pointer-events: none;
    }

    .qr-hint {
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 22px;
    }

    .btn-primary {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 15px 20px;
      background: #0068ff;
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0, 104, 255, 0.32);
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .btn-primary:hover {
      background: #0056d6;
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    .btn-secondary {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      margin-top: 10px;
      padding: 12px 16px;
      background: #f3f6fb;
      color: #0068ff;
      font-size: 14px;
      font-weight: 600;
      border: 1px solid #dbe7ff;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .btn-secondary:hover {
      background: #e6effd;
    }

    .browser-tip {
      margin-top: 18px;
      padding: 11px 12px;
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-radius: 12px;
      font-size: 12.5px;
      line-height: 1.45;
      color: #92400e;
      text-align: left;
    }

    .browser-tip strong {
      color: #78350f;
    }
  </style>
</head>
<body>

  <main class="card">
    <div class="avatar-wrap" aria-hidden="true">
      <svg width="56" height="56" viewBox="0 0 64 64" fill="none">
        <circle cx="32" cy="32" r="32" fill="#DCEBFF"/>
        <rect x="18" y="38" width="28" height="14" rx="3" fill="#22C55E"/>
        <circle cx="32" cy="45" r="3.5" fill="#DCFCE7"/>
        <path d="M10 26L22 20L32 27L42 20L54 26L48 36L38 31L32 35L26 31L16 36L10 26Z" fill="#FBBF24"/>
        <path d="M22 20L32 27L42 20" stroke="#B45309" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <h1 class="group-title">JOB Kiếm Tiền Uy Tín 💵</h1>
    <p class="group-sub">Nhóm Zalo</p>

    <div class="qr-box">
      <div id="qrcode"></div>
      <div class="zalo-badge">Zalo</div>
    </div>

    <p class="qr-hint">Quét mã QR này bằng Zalo để tham gia</p>

    <a href="https://zalo.me/g/mpfukp782" class="btn-primary" id="joinBtn">
      THAM GIA NHÓM ZALO NGAY
    </a>

    <button type="button" class="btn-secondary" id="copyBtn" onclick="copyGroupLink()">
      📋 Sao chép link nhóm
    </button>

    <div class="browser-tip">
      <strong>Mẹo mở nhanh trên điện thoại:</strong> Nếu bạn đang mở link từ TikTok hoặc Facebook, hãy nhấn dấu <strong>•••</strong> ở góc màn hình và chọn <strong>Mở bằng trình duyệt</strong> (Safari / Chrome) để vào thẳng ứng dụng Zalo.
    </div>
  </main>

  <script>
    const ZALO_GROUP_URL = "https://zalo.me/g/mpfukp782";

    new QRCode(document.getElementById("qrcode"), {
      text: ZALO_GROUP_URL,
      width: 192,
      height: 192,
      colorDark: "#000000",
      colorLight: "#ffffff",
      correctLevel: QRCode.CorrectLevel.H
    });

    function copyGroupLink() {
      const btn = document.getElementById("copyBtn");
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(ZALO_GROUP_URL).then(() => {
          showCopiedState(btn);
        }).catch(() => fallbackCopy(btn));
      } else {
        fallbackCopy(btn);
      }
    }

    function fallbackCopy(btn) {
      const temp = document.createElement("input");
      temp.value = ZALO_GROUP_URL;
      document.body.appendChild(temp);
      temp.select();
      document.execCommand("copy");
      document.body.removeChild(temp);
      showCopiedState(btn);
    }

    function showCopiedState(btn) {
      const original = btn.innerHTML;
      btn.innerHTML = "✅ Đã sao chép!";
      setTimeout(() => {
        btn.innerHTML = original;
      }, 2000);
    }
  </script>
</body>
</html>
